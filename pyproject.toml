[project]
name = "twtts"
version = "0.1.0"
description = "Local non-LLM Mandarin text-to-speech"
requires-python = ">=3.11,<3.13"
dependencies = [
  "cn2an>=0.5.23",
  "fastapi>=0.115",
  "g2p-en>=2.1.0",
  "g2pw>=0.1.1",
  "huggingface-hub>=0.34",
  "inflect>=7.5",
  "numpy>=2.0",
  "onnxruntime>=1.22",
  "requests>=2.32",
  "sherpa-onnx>=1.13.8",
  "sherpa-onnx-core==1.13.8",
  "soundfile>=0.13",
  "torch>=2.7",
  "uvicorn>=0.35",
]

[project.scripts]
twtts = "twtts.cli:main"
twtts-server = "twtts.server:main"
twtts-setup = "twtts.setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twtts"]
